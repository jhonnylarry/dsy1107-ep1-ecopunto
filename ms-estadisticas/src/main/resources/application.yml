server:
  port: ${PORT:8082}

spring:
  application:
    name: ms-estadisticas
  datasource:
    url: ${DB_URL:jdbc:h2:mem:estadisticas}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    hikari:
      # Si la base no responde, fallar rápido para que el consumidor reintente o mande a la DLQ.
      connection-timeout: 5000
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  rabbitmq:
    addresses: ${RABBITMQ_ADDRESSES:localhost:5672}
    username: ${RABBITMQ_USER:ecopunto}
    password: ${RABBITMQ_PASSWORD:ecopunto}
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 10
        default-requeue-rejected: false
  # Segundo consumidor de las lecturas de sensores: grupo propio, lee el mismo topic que ms-monitoreo
  # sin quitarle mensajes (cada grupo tiene sus propios offsets).
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ecopunto-estadisticas-sensores
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.value.default.type: cl.duoc.jolarraguibel.ecopunto.estadisticas.mensajeria.sensores.LecturaSensorEvent
        spring.json.use.type.headers: false
        spring.json.trusted.packages: cl.duoc.jolarraguibel.ecopunto.estadisticas.mensajeria.sensores
    listener:
      concurrency: 3
      ack-mode: record

app:
  security:
    issuer: ${JWT_ISSUER:https://login.microsoftonline.com/common/v2.0}
    jwks-uri: ${JWT_JWKS_URI:https://login.microsoftonline.com/common/discovery/v2.0/keys}
    audience: ${JWT_AUDIENCE:api://ecopunto-placeholder}
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:4200}

# Topología de mensajería de este consumidor, centralizada.
ecopunto:
  messaging:
    exchanges:
      eventos: ecopunto.events
      dead-letter: ecopunto.dlx
    cola: estadisticas.reportes
    cola-dlq: estadisticas.reportes.dlq
    # Patrón topic: cualquier evento de reporte (creado, en_revision, resuelto, y futuros).
    binding-key: reporte.*
    reintentos:
      max-intentos: 3
      espera-inicial: 1s
  # Lecturas de sensores (Kafka). Las lecturas inválidas las envía al DLT ms-monitoreo;
  # este servicio solo reintenta los errores transitorios y descarta el resto con log.
  sensores:
    topic-lecturas: ecopunto.sensores.lecturas
    zona-horaria: America/Santiago
    reintentos:
      max-intentos: 3
      espera-inicial: 1s
      multiplicador: 2.0
