<main class="container">
  <header class="hero">
    <span class="hero-icon">♻️</span>
    <h1>EcoPunto</h1>
    <p>Consulta el estado de los puntos limpios de tu zona y reporta si un material ya no se puede depositar.</p>
  </header>

  <section class="card">
    @if (auth.isAuthenticated()) {
      <p class="session-label">Sesión activa</p>
      <p class="session-user">{{ auth.getAccount()?.username }}</p>
      <div class="actions">
        <a routerLink="/puntos-limpios"><button type="button">Ir a puntos limpios</button></a>
        <button type="button" class="secondary" (click)="auth.logout()">Cerrar sesión</button>
      </div>
    } @else {
      <p class="session-label">Necesitás iniciar sesión para ver tus puntos limpios</p>
      <button type="button" (click)="auth.login()">Iniciar sesión</button>
    }
  </section>
</main>
