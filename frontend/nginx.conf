server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # El certificado se monta en runtime (no viaja en la imagen ni en el
    # repo) desde el host que corre el contenedor. Ver README para el
    # comando de despliegue con Docker sobre HTTPS.
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
