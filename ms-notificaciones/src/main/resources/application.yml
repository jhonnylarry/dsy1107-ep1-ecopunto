spring:
  application:
    name: ms-notificaciones
  main:
    # Servicio sin API HTTP: solo consume mensajes.
    web-application-type: none
  datasource:
    url: ${DB_URL:jdbc:h2:mem:notificaciones}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    hikari:
      # Si la base no responde, fallar rápido para que el consumidor reintente o mande a la DLQ.
      connection-timeout: 5000
  jpa:
    hibernate:
      ddl-auto: update
  rabbitmq:
    addresses: ${RABBITMQ_ADDRESSES:localhost:5672}
    username: ${RABBITMQ_USER:ecopunto}
    password: ${RABBITMQ_PASSWORD:ecopunto}
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 10
        default-requeue-rejected: false
  # Consumidor de los cambios de estado de contenedores (Kafka).
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ecopunto-notificaciones-sensores
      # Un grupo nuevo parte desde el final: avisar de un estado antiguo no le sirve al encargado.
      # (ms-monitoreo y ms-estadisticas parten desde el principio porque necesitan la historia.)
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.value.default.type: cl.duoc.jolarraguibel.ecopunto.notificaciones.mensajeria.sensores.EstadoContenedorEvent
        spring.json.use.type.headers: false
        spring.json.trusted.packages: cl.duoc.jolarraguibel.ecopunto.notificaciones.mensajeria.sensores
    listener:
      concurrency: 3
      ack-mode: record

# Topología de mensajería de este consumidor, centralizada.
ecopunto:
  messaging:
    exchanges:
      eventos: ecopunto.events
      dead-letter: ecopunto.dlx
    cola: notificaciones.reportes
    cola-dlq: notificaciones.reportes.dlq
    # Una cola, dos bindings: aviso al encargado (creado) y al vecino (resuelto).
    routing-keys:
      reporte-creado: reporte.creado
      reporte-resuelto: reporte.resuelto
    reintentos:
      max-intentos: 3
      espera-inicial: 1s
  sensores:
    topic-estado: ecopunto.contenedores.estado
    reintentos:
      max-intentos: 3
      espera-inicial: 1s
      multiplicador: 2.0
  notificaciones:
    correo-encargados: ${CORREO_ENCARGADOS:encargados@ecopunto.cl}
