# Clúster de 2 nodos con descubrimiento estático (classic_config).
# Cada nodo conoce la lista completa; el segundo en arrancar se une al primero.
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbit1
cluster_formation.classic_config.nodes.2 = rabbit@rabbit2

# Las colas quorum se reparten entre ambos nodos.
quorum_queue.initial_cluster_size = 2

loopback_users.guest = false
